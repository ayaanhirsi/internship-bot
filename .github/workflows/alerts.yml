name: internship-alerts

on:
  schedule:
    # Every hour from 8 AM to 6 PM Toronto time (EDT).
    # After Nov 1 this becomes 7 AM to 5 PM; change to "0 13-23 * * *" to keep 8-6.
    - cron: "0 12-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Find internships and send alerts
        run: python notify.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_RECRUITERS_WEBHOOK: ${{ secrets.DISCORD_RECRUITERS_WEBHOOK }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}

      - name: Save seen internships and recruiter cache
        run: |
          git config user.name "internship-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          if [ -f companies.json ]; then git add companies.json; fi
          git diff --cached --quiet || (git commit -m "update seen" && git push)
